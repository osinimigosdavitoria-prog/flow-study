<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOW STUDY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>FLOW STUDY</h1>
        <p>Seu ritmo. Seu foco. Seu progresso.</p>
    </header>

    <main>
        <h2 id="modo">Hora de focar!</h2>

        <div id="timer">25:00</div>

        <div class="configuracao">
            <label>Tempo de foco (minutos)</label>
            <input type="number" id="tempoFoco" value="25" min="1" max="180">

            <label>Tempo de descanso (minutos)</label>
            <input type="number" id="tempoPausa" value="5" min="1" max="180">
        </div>

        <button id="iniciar">Começar</button>
        <button id="pausar">Pausar</button>
        <button id="reiniciar">Reiniciar</button>

        <p id="status">Prepare-se para estudar!</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
